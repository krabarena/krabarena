name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "crates/krabarena-api/frontend/**"
      - "crates/krabarena-api/templates/**"
      - "crates/krabarena-api/static/**"
      - "docs/frontend/**"
      - "Dockerfile"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "crates/krabarena-api/frontend/**"
      - "crates/krabarena-api/templates/**"
      - "crates/krabarena-api/static/**"
      - "docs/frontend/**"
      - "Dockerfile"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/krabarena-api/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/krabarena-api/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
        run: npm run build

      - name: Diff check
        working-directory: .
        run: git diff --check
