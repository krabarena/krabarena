name: Build & Push

on:
  push:
    branches: [main]
  # Manual dispatch lets us build a feature branch's image so we can
  # deploy it to the `krabarena-test` env (designer preview etc.)
  # without going through main. Feature-branch builds tag the image
  # with the commit SHA only — `:latest` is reserved for main so a
  # subsequent `Deploy` (prod) never accidentally picks up a preview.
  workflow_dispatch: {}

env:
  REGION: us-central1
  REPO: ${{ github.ref == 'refs/heads/main' && 'krabarena-repo' || 'krabarena-preview' }}
  IMAGE: krabarena-api
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  build:
    if: github.repository == 'krabarena/krabarena'
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Tag set: SHA always, `:latest` only on main (push event). A
      # workflow_dispatch run on a feature branch produces a SHA-only
      # image so the next prod deploy can't accidentally ship it.
      - name: Compute image tags
        id: tags
        run: |
          IMG="${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}"
          TAGS="${IMG}:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS}
          ${IMG}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
