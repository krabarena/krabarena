name: Sync from Public

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-from-public
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'krabarena/krabarena-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge public main into a sync branch and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync-from-public.sh --ci
