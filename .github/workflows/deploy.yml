name: Deploy

# Stage 3 of the release pipeline:
#
#   Build & Push ─► Deploy to Test ─► E2E ─► Deploy (prod)  ← this workflow
#
# Keys off `Deploy to Test`'s success, not `Build & Push`'s. A failing
# test env or failing E2E blocks prod automatically. The manual
# `workflow_dispatch` escape hatch is still available for emergency
# patches that can't wait on the test pipeline.

on:
  workflow_run:
    workflows: [Deploy to Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
      skip_test_env:
        description: 'Emergency: deploy to prod without waiting on test (not recommended)'
        required: false
        default: 'false'
      bootstrap_migrations:
        description: 'Seed _sqlx_migrations for a legacy DB (run once, then leave false)'
        required: false
        default: 'false'

env:
  REGION: us-central1
  SERVICE: krabarena-api
  REPO: krabarena-repo

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.repository == 'krabarena/krabarena' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Every credential resolves from Secret Manager at instance start
      # (`--set-secrets`). Secret containers, IAM and the rotation
      # runbook live in the private krabarena/krabarena-infra repo.
      - name: Deploy to Cloud Run
        env:
          BOOTSTRAP: ${{ github.event.inputs.bootstrap_migrations == 'true' && 'true' || 'false' }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/krabarena-api:${{ steps.tag.outputs.tag }}"
          BASE_REMOVE="RECAPTCHA_ENTERPRISE_API_KEY,REDIS_URL,DISCORD_MONITOR_BOT_TOKEN,DISCORD_MONITOR_CHANNEL_ID,KRABSCOUT_WEBHOOK_SECRET,KRABSCOUT_WEBHOOK_URL"
          if [ "$BOOTSTRAP" = "true" ]; then
            REMOVE_VARS="$BASE_REMOVE"
            MIGRATE_VARS=",BOOTSTRAP_SQLX_MIGRATIONS=true,SQLX_AUTO_MIGRATE=true"
          else
            REMOVE_VARS="BOOTSTRAP_SQLX_MIGRATIONS,$BASE_REMOVE"
            MIGRATE_VARS=",SQLX_AUTO_MIGRATE=true"
          fi
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${IMAGE}" \
            --region ${{ env.REGION }} \
            --port 8080 \
            --memory 512Mi \
            --vpc-connector krabarena-redis-conn \
            --vpc-egress private-ranges-only \
            --timeout 1800 \
            --remove-env-vars "$REMOVE_VARS" \
            --set-secrets "\
              DATABASE_URL=database-url:latest,\
              JWT_SECRET=jwt-secret:latest,\
              MAILGUN_API_KEY=mailgun-api-key:latest,\
              MAILGUN_DOMAIN=mailgun-domain:latest,\
              GEMINI_API_KEY=gemini-api-key:latest,\
              CRON_SHARED_SECRET=cron-shared-secret:latest,\
              GITHUB_CLIENT_ID=github-client-id:latest,\
              GITHUB_CLIENT_SECRET=github-client-secret:latest,\
              GOOGLE_CLIENT_ID=google-client-id:latest,\
              GOOGLE_CLIENT_SECRET=google-client-secret:latest,\
              RECAPTCHA_ENTERPRISE_API_KEY=recaptcha-enterprise-api-key:latest,\
              REDIS_URL=redis-url:latest,\
              DISCORD_MONITOR_BOT_TOKEN=discord-monitor-bot-token:latest,\
              DISCORD_MONITOR_CHANNEL_ID=discord-monitor-channel-id:latest" \
            --update-env-vars "\
              BLOB_STORE_URL=gs://krabarena-artifacts,\
              PRIVATE_BLOB_STORE_URL=gs://krabarena-artifacts-private,\
              NODE_ENV=${{ vars.NODE_ENV }},\
              GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }},\
              RECAPTCHA_SITE_KEY=${{ vars.RECAPTCHA_SITE_KEY }},\
              RECAPTCHA_ENTERPRISE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},\
              RECAPTCHA_SCORE_THRESHOLD=0.5,\
              DISCORD_SUPPORT_INVITE_URL=https://discord.gg/K3zmyrqBSz,\
              GITHUB_REPO_URL=https://github.com/krabarena/krabarena,\
              DISCORD_MONITOR_ENABLED=true,\
              NOTIFICATION_EMAILS_ENABLED=true${MIGRATE_VARS}" \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --quiet

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          {
            echo "## Deploy Result"
            echo "- **URL**: ${URL}"
            echo "- **Image**: krabarena-api:${{ steps.tag.outputs.tag }}"
            echo "- **Region**: ${{ env.REGION }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/about")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: HTTP ${STATUS}"
            exit 1
          fi
          echo "Smoke test passed: HTTP ${STATUS}"

      # og-render is a SEPARATE long-running Cloud Run service (its own
      # image) that screenshots this API's /og-html templates with a warm,
      # REUSED headless Chromium. Because that Chromium is reused across
      # renders, it can hold the /og-html HTML/CSS/fonts it cached BEFORE
      # this deploy and keep screenshotting the stale card design until it
      # is restarted. So every prod deploy forces a fresh og-render revision
      # (new container = empty Chromium cache = renders the just-deployed
      # design). Best-effort: the web app is already live, so an og-render
      # hiccup must not fail the deploy.
      #
      # NOTE: this refreshes the RENDERER, not the cached PNGs. The OG PNG
      # cache in gs://krabarena-artifacts/og/{battles,claims} keys on the
      # battle/claim DATA, not the card design — so a pure *design* change
      # (reskin, OG template/CSS edit) ALSO needs a one-time cache bust:
      #   gcloud storage rm --recursive \
      #     gs://krabarena-artifacts/og/battles/ gs://krabarena-artifacts/og/claims/
      # See services/og-render/README.md → "Deploy contract".
      - name: Refresh og-render (clear stale Chromium cache)
        continue-on-error: true
        run: |
          # --execution-environment=gen2 is REQUIRED: headless Chromium hangs
          # on launch under gen1 (browserType.launch: Timeout exceeded → every
          # render 502s → stale/fallback OG cards). Re-assert it here so a
          # manual gen1 redeploy can never silently regress OG rendering.
          gcloud run services update og-render \
            --region ${{ env.REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --execution-environment gen2 \
            --update-env-vars "OG_RENDER_REFRESH_SHA=${{ github.sha }}" \
            --quiet
          echo "og-render refreshed to a fresh gen2 revision (deploy SHA ${{ github.sha }})"
