name: Refresh Test DB

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: refresh-test-db
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-fork test-e2e from prod
    if: github.repository == 'krabarena/krabarena' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: neon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      - name: Re-fork and store the connection string
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          NEON_API_KEY=$(gcloud secrets versions access latest --secret neon-api-key --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$NEON_API_KEY"
          export NEON_API_KEY
          scripts/ci/neon.sh ensure test-e2e true true | scripts/ci/put-secret.sh database-url krabarena-test

      - name: Redeploy the test environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to Test" --repo "$GITHUB_REPOSITORY" --ref main -f image_tag=latest
