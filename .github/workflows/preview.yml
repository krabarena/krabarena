name: Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to preview against a copy of prod data
        required: true
      fresh_data:
        description: Re-fork the preview database from prod
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-${{ inputs.branch }}
  cancel-in-progress: false

env:
  REGION: us-central1
  TEST_PROJECT: krabarena-test
  REGISTRY: us-central1-docker.pkg.dev/krabbit-dev/krabarena-preview

jobs:
  database:
    name: Fork prod database
    if: github.repository == 'krabarena/krabarena' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: neon
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: slug
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null || { echo "::error::Branch $BRANCH does not exist"; exit 1; }
          SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-30 | sed -E 's/-+$//')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      - name: Create or reuse the Neon branch
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          SLUG: ${{ steps.slug.outputs.slug }}
          FRESH: ${{ inputs.fresh_data }}
        run: |
          NEON_API_KEY=$(gcloud secrets versions access latest --secret neon-api-key --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$NEON_API_KEY"
          export NEON_API_KEY
          scripts/ci/neon.sh ensure "preview/$SLUG" "$FRESH" true \
            | scripts/ci/put-secret.sh "preview-$SLUG-database-url" "$TEST_PROJECT"

  build:
    name: Build branch image
    needs: database
    runs-on: ubuntu-latest
    environment: test
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/krabarena-api:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy preview
    needs: [database, build]
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      - name: Deploy Cloud Run preview
        env:
          SLUG: ${{ needs.database.outputs.slug }}
          SHA: ${{ needs.build.outputs.sha }}
          BRANCH: ${{ inputs.branch }}
        run: |
          gcloud run deploy "pv-$SLUG" \
            --image "$REGISTRY/krabarena-api:$SHA" \
            --region "$REGION" \
            --project "$TEST_PROJECT" \
            --port 8080 \
            --memory 512Mi \
            --allow-unauthenticated \
            --labels "preview=true,slug=$SLUG" \
            --set-secrets "DATABASE_URL=preview-$SLUG-database-url:latest,JWT_SECRET=jwt-secret:latest,TEST_AUTH_SECRET=test-auth-secret:latest,GEMINI_API_KEY=gemini-api-key:latest" \
            --update-env-vars "BLOB_STORE_URL=gs://krabarena-artifacts,PRIVATE_BLOB_STORE_URL=gs://krabarena-test-artifacts-private,NODE_ENV=${{ vars.TEST_NODE_ENV }},GITHUB_REPO_URL=https://github.com/krabarena/krabarena,DISCORD_MONITOR_ENABLED=false,NOTIFICATION_EMAILS_ENABLED=false,SQLX_AUTO_MIGRATE=true" \
            --quiet
          URL=$(gcloud run services describe "pv-$SLUG" --region "$REGION" --project "$TEST_PROJECT" --format 'value(status.url)')
          for _ in $(seq 1 24); do
            curl -fsS "$URL/health" | grep -q '"status":"healthy"' && break
            sleep 5
          done
          curl -fsS "$URL/health"
          {
            echo "## Preview of \`$BRANCH\`"
            echo "- **URL**: $URL"
            echo "- **Commit**: $SHA"
            echo "- **Database**: Neon branch \`preview/$SLUG\` forked from prod"
            echo "- Removed when the branch is deleted, or after 7 days"
          } >> "$GITHUB_STEP_SUMMARY"
