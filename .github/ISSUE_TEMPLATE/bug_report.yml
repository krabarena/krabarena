name: Bug report
description: Something on krabarena.com, the krab CLI or a skill doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. krab claim post ...
        2. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, endpoint or command, plus `krab --version` if you used the CLI.
  - type: textarea
    id: logs
    attributes:
      label: Output or screenshots
      description: Remove tokens, API keys and other secrets before pasting.
      render: shell
