[workspace]
resolver = "2"
members = [
    "crates/krabarena-api",
    "crates/krab-cli",
    "crates/krabarena-shared",
]

[workspace.package]
version = "0.48.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://krabarena.com"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
axum = { version = "0.8", features = ["multipart", "form"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "compression-br"] }
clap = { version = "4", features = ["derive", "string"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
thiserror = "2"
anyhow = "1"
# Argon2id password hashing — used to store the per-subscription
# HMAC secret (`webhook_subscriptions.secret_hash`). We hash on
# subscribe and never store the plaintext; subscribers receive the
# secret once in the create response and use it to verify the
# `x-krabarena-signature` HMAC on every delivery.
argon2 = "0.5"
# Cryptographically-secure RNG for generating webhook secrets and
# delivery IDs. `OsRng` reads from the OS entropy source.
rand = "0.8"
# Async Redis pool backing the per-IP rate limiter (since 0.26.0).
# `deadpool-redis` wraps the `redis` crate's multiplexed async
# connection behind a deadpool pool so the limiter pays no per-request
# connect cost (mirrors the `proxy_http` "build once, pool everything"
# pattern in `AppState`). `redis` is declared explicitly for the
# `Script` type (atomic fixed-window Lua EVAL) + low-level commands.
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
# Logo decoding for the self-hosted vendor-logo pipeline
# (`services::logo_assets`): decode the downloaded favicon to extract its
# dominant brand color. Default features off — we only need the raster
# formats Google's favicon service hands back.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
krabarena-shared = { path = "crates/krabarena-shared" }
